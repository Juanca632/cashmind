appId: com.juancrestrepo.cashmind
# Smoke: mark an expense as "Repeat every month", see it in My plan and keep it after a restart (018 US1, US3).
# The month rollover is covered by Jest: it cannot be checked on the emulator's real date.
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/add-first-income.yaml
    env:
      AMOUNT: "2000"
- tapOn: "Add expense"
- tapOn: "Amount"
- inputText: "900"
- hideKeyboard
- tapOn: "Housing"
- tapOn: "Note (optional)"
- inputText: "Rent"
- hideKeyboard
- scrollUntilVisible:
    element: "Repeat every month"
- tapOn: "Repeat every month"
- tapOn:
    text: "Add expense"
    index: 1
- extendedWaitUntil:
    visible: "My plan"
    timeout: 10000
# The row's accessible name ends with ", recorded by a repeat" (the repeat icon has no text).
- assertVisible: "Rent.*recorded by a repeat"
# My plan lists it under "Every month" with the monthly fixed costs.
- tapOn: "My plan"
- scrollUntilVisible:
    element: "Every month"
- assertVisible: "Rent.*900,00.€.*every month"
- assertVisible: "Fixed costs.*900,00.€ a month"
# Restart without clearing the data: the monthly item is still there.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "My plan"
    timeout: 15000
- assertVisible: "Rent.*recorded by a repeat"
- tapOn: "My plan"
- scrollUntilVisible:
    element: "Every month"
- assertVisible: "Rent.*900,00.€.*every month"
- assertVisible: "Fixed costs.*900,00.€ a month"

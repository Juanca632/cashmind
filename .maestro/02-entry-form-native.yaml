appId: com.juancrestrepo.cashmind
# Smoke: Android calendar, keyboard and back button on the entry form (017 US2, 001 US3-4, 022).
---
- runFlow: subflows/launch-clean.yaml
- runFlow:
    file: subflows/add-first-income.yaml
    env:
      AMOUNT: "1000"
- tapOn: "Add expense"
# Calendar: pick the 1st of the month.
- tapOn: "Date: .*"
- tapOn: "1"
- tapOn: "OK"
- assertVisible: "Date: .* 1 .*"
# Calendar: closing without confirming keeps the date.
- tapOn: "Date: .*"
- tapOn: "Cancel"
- assertVisible: "Date: .* 1 .*"
# Only the date changed: leaving asks first. The form opens with the keyboard closed (022) and
# nothing was typed, so the first back is not spent on closing a keyboard.
- back
- assertVisible: "Discard changes?"
- tapOn: "Keep editing"
- assertVisible: "Date: .* 1 .*"
# The keyboard stays closed after "Keep editing", so the next back asks again.
- back
- assertVisible: "Discard changes?"
- tapOn: "Discard"
- assertVisible: "My plan"
